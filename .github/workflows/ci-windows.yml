name: CI Windows

# Windows のビルドは時間がかかるので，Windows に関わるファイルが変わった PR でだけ動かす(持ち主の PR では動かさない)．
# まとめて確かめるときは手で動かす: gh workflow run ci-windows.yml --ref <ブランチ>
on:
  pull_request:
    paths:
      - "apps/windows/**"
      - "core/**"
      - "protocol/**"
      - "design/tokens/**"
      - "tools/windows/**"
      - "LICENSES/**"
      - "THIRD_PARTY_NOTICES*"
      - ".github/workflows/ci-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-windows-${{ github.ref }}
  # 同じブランチ(main を含む)に新しいコミットが来たら，古い実行を止める．キャッシュは新しい実行が残す
  cancel-in-progress: true

# 仕事の名前は ci.yml と同じ決まり(何を-どこで)．インストーラーを作るのは package-windows.yml
jobs:
  rust-windows:
    # 持ち主の PR は結果を待たずにマージするので動かさない(費用を抑える)．まとめて確かめるときは手で動かす．ほかの人の PR では動かす
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login != github.repository_owner
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # キャッシュは失敗・取り消しでも残す(restore と save を分ける)．鍵は実行ごとに変え，前の実行のものから戻す
      - id: cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/windows/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/windows/Cargo.lock', 'apps/windows/rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('apps/windows/Cargo.lock', 'apps/windows/rust-toolchain.toml') }}-
      - run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # 候補ウィンドウの見本を PNG に書き出す．macOS の --render-snapshots(design/mockups)と見比べる
      - run: cargo run --locked -p candidate-ui -- --render-snapshots target/snapshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-ui-snapshots
          path: apps/windows/target/snapshots
          if-no-files-found: error
      - run: cargo build --locked --release -p tsf
      - run: ../../tools/windows/check_exports.ps1 -Dll target/release/s90_tsf.dll
        shell: pwsh
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/windows/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/windows/Cargo.lock', 'apps/windows/rust-toolchain.toml') }}-${{ github.run_id }}

  core-windows:
    # 持ち主の PR は結果を待たずにマージするので動かさない(費用を抑える)．まとめて確かめるときは手で動かす．ほかの人の PR では動かす
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login != github.repository_owner
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE
      - run: swift --version
      # キャッシュは失敗・取り消しでも残す(restore と save を分ける)．鍵は実行ごとに変え，前の実行のものから戻す
      - id: swiftbuild
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: core/.build
          key: swift-zenzai-${{ runner.os }}-6.3.3-${{ hashFiles('core/Package.resolved') }}-${{ github.run_id }}
          restore-keys: |
            swift-zenzai-${{ runner.os }}-6.3.3-${{ hashFiles('core/Package.resolved') }}-
      - run: |
          tools/windows/fetch_llama.ps1 -Output "$env:RUNNER_TEMP\llama"
          "LLAMA_DIR=$env:RUNNER_TEMP\llama" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$env:RUNNER_TEMP\llama" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
        shell: pwsh
      - run: swift build --package-path core -Xswiftc "-L$env:LLAMA_DIR"
      - run: swift test --package-path core -Xswiftc "-L$env:LLAMA_DIR"
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: core/.build
          key: swift-zenzai-${{ runner.os }}-6.3.3-${{ hashFiles('core/Package.resolved') }}-${{ github.run_id }}
