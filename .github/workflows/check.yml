name: check

# 費用を抑えるため，今は自動では動かさない(利用者の指示 2026-10-27)．実装がそろってから手で一度にまとめて動かす:
#   gh workflow run <このファイル名> --ref main
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  # main は取り消さない(キャッシュを残す)．PR は新しい push で古い実行を止める
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make check PYTHON="python3 -I"

  core-test:
    # core のテスト．変換エンジンの辞書を取得するので数分かかる．
    # 本物の Zenzai のテストと処理時間(R-01)は Release でだけ動かす(make test-zenzai)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # Zenzai のモデルはリポジトリの外に置き，キャッシュから戻す
      MODELS_DIR: ${{ github.workspace }}/../models
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 依存(swift-collections 1.7 以降)が Swift 6.2 を要るので，開発の Mac と同じ Xcode 26 の最新を使う
      - run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "使う Xcode: $xcode"
          sudo xcode-select -s "$xcode"
          swift --version
      # SwiftPM の依存と作ったものを残す．失敗・取り消しでも残し，前の実行のものから戻す
      - id: corebuild
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            core/.build
            ~/Library/Caches/org.swift.swiftpm
          key: core-${{ runner.os }}-${{ hashFiles('core/Package.resolved') }}-${{ github.run_id }}
          restore-keys: |
            core-${{ runner.os }}-${{ hashFiles('core/Package.resolved') }}-
      # モデルは毎回取らずにキャッシュする．取得元とハッシュは fetch_zenzai.sh にあるので，それが変わったら取り直す
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/../models
          key: zenzai-${{ hashFiles('tools/models/fetch_zenzai.sh') }}
      # キャッシュから戻したときも SHA-256 を確かめる
      - run: make fetch-models
      - run: make test-debug
      - run: make test-zenzai
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            core/.build
            ~/Library/Caches/org.swift.swiftpm
          key: core-${{ runner.os }}-${{ hashFiles('core/Package.resolved') }}-${{ github.run_id }}
