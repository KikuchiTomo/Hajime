name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make check PYTHON="python3 -I"

  core-test:
    # core のテスト．変換エンジンの辞書を取得するので数分かかる．
    # 本物の Zenzai のテストと処理時間(R-01)は Release でだけ動かす(make test-zenzai)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # Zenzai のモデルはリポジトリの外に置き，キャッシュから戻す
      MODELS_DIR: ${{ github.workspace }}/../models
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 依存(swift-collections 1.7 以降)が Swift 6.2 を要るので，開発の Mac と同じ Xcode 26 の最新を使う
      - run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "使う Xcode: $xcode"
          sudo xcode-select -s "$xcode"
          swift --version
      # モデルは毎回取らずにキャッシュする．取得元とハッシュは fetch_zenzai.sh にあるので，それが変わったら取り直す
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/../models
          key: zenzai-${{ hashFiles('tools/models/fetch_zenzai.sh') }}
      # キャッシュから戻したときも SHA-256 を確かめる
      - run: make fetch-models
      - run: make test-debug
      - run: make test-zenzai
