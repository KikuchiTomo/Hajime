name: Release

# タグ vX.Y.Z を push すると，macOS と Windows の配布物を作り，GitHub の 1 つのリリースに置く．
# タグは tools/release/bump_version.sh で両方のバージョンを上げてマージしたあとに付ける．手で動かすときはタグを指定する:
#   gh workflow run release.yml -f tag=v0.1.1
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 配布するタグ(v0.1.1 など)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    # タグのバージョンを読み，リポジトリに書いた macOS と Windows のバージョンと同じかを確かめる
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - id: tag
        env:
          # タグは利用者が付けた文字列なので，シェルに直接埋め込まず環境変数で渡す
          TAG: ${{ inputs.tag || github.ref_name }}
        run: tools/release/check_tag.sh "$TAG" >> "$GITHUB_OUTPUT"

  package-macos:
    needs: prepare
    uses: ./.github/workflows/package-macos.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}
      require-signing: true
    # 署名と公証に使う Secrets だけを渡す
    secrets:
      MACOS_CERTIFICATES_P12: ${{ secrets.MACOS_CERTIFICATES_P12 }}
      MACOS_CERTIFICATES_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

  package-windows:
    needs: prepare
    uses: ./.github/workflows/package-windows.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}

  publish:
    # 両方の OS の配布物と SHA-256 の一覧を 1 つのリリースに置く．書き込みの権限はこの仕事にだけ渡す
    needs: [prepare, package-macos, package-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: tools/release/publish.sh "$TAG" "$VERSION" dist
