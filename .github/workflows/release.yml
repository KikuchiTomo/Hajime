name: Release

# タグ macos/vX.Y.Z か windows/vX.Y.Z を push すると，その OS の配布物を作り，GitHub の Releases に置く(docs/dev/RELEASE.md)．
# タグは tools/release/bump_version.sh でバージョンを上げてマージしたあとに付ける．手で動かすときはタグを指定する:
#   gh workflow run release.yml -f tag=macos/v0.1.1
# 配布物には署名しない．署名の設定は利用者が行う(ここでは秘密の値を使わない)
on:
  push:
    tags:
      - "macos/v*"
      - "windows/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 配布するタグ(macos/v0.1.1 など)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    # タグの OS とバージョンを読み，リポジトリに書いたバージョンと同じかを確かめる
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      platform: ${{ steps.tag.outputs.platform }}
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - id: tag
        env:
          # タグは利用者が付けた文字列なので，シェルに直接埋め込まず環境変数で渡す
          TAG: ${{ inputs.tag || github.ref_name }}
        run: tools/release/check_tag.sh "$TAG" >> "$GITHUB_OUTPUT"

  package-macos:
    needs: prepare
    if: needs.prepare.outputs.platform == 'macos'
    uses: ./.github/workflows/package-macos.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}

  package-windows:
    needs: prepare
    if: needs.prepare.outputs.platform == 'windows'
    uses: ./.github/workflows/package-windows.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}

  publish:
    # 作った配布物と SHA-256 の一覧を Releases に置く．書き込みの権限はこの仕事にだけ渡す
    needs: [prepare, package-macos, package-windows]
    if: always() && needs.prepare.result == 'success' && (needs.package-macos.result == 'success' || needs.package-windows.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-${{ needs.prepare.outputs.platform }}
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PLATFORM: ${{ needs.prepare.outputs.platform }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: tools/release/publish.sh "$TAG" "$PLATFORM" "$VERSION" dist
