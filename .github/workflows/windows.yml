name: windows

# Windows のビルドは時間がかかるので，Windows に関わるファイルが変わったときだけ動かす
# 費用を抑えるため，今は自動では動かさない(利用者の指示 2026-10-27)．実装がそろってから手で一度にまとめて動かす:
#   gh workflow run <このファイル名> --ref main
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  # main は取り消さない(最後まで動かしてキャッシュを残し，PR がそれを使う)．PR は新しい push で古い実行を止める
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # キャッシュは失敗・取り消しでも残す(restore と save を分ける)．鍵は実行ごとに変え，前の実行のものから戻す
      - id: cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/windows/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/windows/Cargo.lock', 'apps/windows/rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('apps/windows/Cargo.lock', 'apps/windows/rust-toolchain.toml') }}-
      - run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # 候補ウィンドウの見本を PNG に書き出す．macOS の --render-snapshots(design/mockups)と見比べる
      - run: cargo run --locked -p candidate-ui -- --render-snapshots target/snapshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-ui-snapshots
          path: apps/windows/target/snapshots
          if-no-files-found: error
      - run: cargo build --locked --release -p tsf
      - run: ../../tools/windows/check_exports.ps1 -Dll target/release/s90_tsf.dll
        shell: pwsh
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/windows/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/windows/Cargo.lock', 'apps/windows/rust-toolchain.toml') }}-${{ github.run_id }}

  swift:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE
      - run: swift --version
      # キャッシュは失敗・取り消しでも残す(restore と save を分ける)．鍵は実行ごとに変え，前の実行のものから戻す
      - id: swiftbuild
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: core/.build
          key: swift-zenzai-${{ runner.os }}-6.3.3-${{ hashFiles('core/Package.resolved') }}-${{ github.run_id }}
          restore-keys: |
            swift-zenzai-${{ runner.os }}-6.3.3-${{ hashFiles('core/Package.resolved') }}-
      - run: |
          tools/windows/fetch_llama.ps1 -Output "$env:RUNNER_TEMP\llama"
          "LLAMA_DIR=$env:RUNNER_TEMP\llama" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$env:RUNNER_TEMP\llama" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
        shell: pwsh
      - run: swift build --package-path core -Xswiftc "-L$env:LLAMA_DIR"
      - run: swift test --package-path core -Xswiftc "-L$env:LLAMA_DIR"
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: core/.build
          key: swift-zenzai-${{ runner.os }}-6.3.3-${{ hashFiles('core/Package.resolved') }}-${{ github.run_id }}

  package:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE
      # キャッシュは失敗・取り消しでも残す(restore と save を分ける)．鍵は実行ごとに変え，前の実行のものから戻す
      - id: swiftrelease
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: core/.build
          key: swift-release-zenzai-${{ runner.os }}-6.3.3-${{ hashFiles('core/Package.resolved') }}-${{ github.run_id }}
          restore-keys: |
            swift-release-zenzai-${{ runner.os }}-6.3.3-${{ hashFiles('core/Package.resolved') }}-
      - run: |
          tools/windows/fetch_llama.ps1 -Output "$env:RUNNER_TEMP\llama"
          "LLAMA_DIR=$env:RUNNER_TEMP\llama" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$env:RUNNER_TEMP\llama" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
        shell: pwsh
      - run: tools/windows/fetch_zenzai.ps1 -Output "$env:RUNNER_TEMP\zenzai"
        shell: pwsh
      - run: swift build --package-path core -c release --product s90-engine-host -Xswiftc "-L$env:LLAMA_DIR"
      - run: rustup toolchain install
        working-directory: apps/windows
      - run: rustup target add i686-pc-windows-msvc
        working-directory: apps/windows
      - run: cargo build --locked --release
        working-directory: apps/windows
      - run: cargo build --locked --release -p tsf --target i686-pc-windows-msvc
        working-directory: apps/windows
      - run: tools/windows/stage.ps1 -Output apps/windows/target/stage -Llama "$env:RUNNER_TEMP\llama" -Zenzai "$env:RUNNER_TEMP\zenzai"
        shell: pwsh
      - run: dotnet tool install --global wix --version 6.0.2
      - run: wix build apps/windows/installer/s90.wxs -arch x64 -d Version=0.1.0 -d StageDir=apps/windows/target/stage -o apps/windows/target/s90-tokyo-ime.msi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: s90-tokyo-ime-windows
          path: apps/windows/target/s90-tokyo-ime.msi
          if-no-files-found: error
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: core/.build
          key: swift-release-zenzai-${{ runner.os }}-6.3.3-${{ hashFiles('core/Package.resolved') }}-${{ github.run_id }}
