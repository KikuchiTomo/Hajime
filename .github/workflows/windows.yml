name: windows

# Windows 版(apps/windows の Rust と，core の Windows でのビルド)を確かめる．
# 手元の Mac には Windows 向けの道具がないので，Windows でのビルドとテストはここで行う
on:
  pull_request:
  push:
    branches: [main]
  # PR を出す前の作業のブランチでも動かせるように(gh workflow run windows.yml --ref <ブランチ>)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/windows/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/windows/Cargo.lock', 'apps/windows/rust-toolchain.toml') }}
      # バージョンは rust-toolchain.toml で固定している．rustup は runner に入っている
      - run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
