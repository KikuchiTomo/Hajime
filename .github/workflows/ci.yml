name: CI

# PR で動かす(macOS の仕事は持ち主の PR では動かさない)．まとめて確かめるときは手で動かす: gh workflow run ci.yml --ref <ブランチ>
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # 同じブランチ(main を含む)に新しいコミットが来たら，古い実行を止める．キャッシュは新しい実行が残す
  cancel-in-progress: true

# ワークフローの名前の決まり(docs/dev/REPOSITORY.md): ファイルは ci・ci-windows・package-<OS>・release・pr-title．
# 仕事の名前は「何を-どこで」(lint，core-macos，app-macos)．必須の検査はこの仕事の名前で指定する
jobs:
  lint:
    # skills・文言・層・コントラスト・生成したファイル
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make check PYTHON="python3 -I"

  core-macos:
    # 持ち主の PR は結果を待たずにマージするので動かさない(費用を抑える)．まとめて確かめるときは手で動かす．ほかの人の PR では動かす
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login != github.repository_owner
    # core のテスト．変換エンジンの辞書を取得するので数分かかる．
    # 本物の Zenzai のテストと処理時間(R-01)は Release でだけ動かす(make test-zenzai)
    runs-on: macos-15
    # キャッシュが無いときは，変換エンジンと辞書をはじめから作るので 45 分では足りない(2026-10-27 に打ち切られた)
    timeout-minutes: 90
    env:
      # Zenzai のモデルはリポジトリの外に置き，キャッシュから戻す
      MODELS_DIR: ${{ github.workspace }}/../models
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 依存(swift-collections 1.7 以降)が Swift 6.2 を要るので，開発の Mac と同じ Xcode 26 の最新を使う
      - run: |
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          echo "使う Xcode: $xcode"
          sudo xcode-select -s "$xcode"
          swift --version
      # SwiftPM の依存と作ったものを残す．失敗・取り消しでも残し，前の実行のものから戻す
      - id: corebuild
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            core/.build
            ~/Library/Caches/org.swift.swiftpm
          key: core-${{ runner.os }}-${{ hashFiles('core/Package.resolved') }}-${{ github.run_id }}
          restore-keys: |
            core-${{ runner.os }}-${{ hashFiles('core/Package.resolved') }}-
      # モデルは毎回取らずにキャッシュする．取得元とハッシュは fetch_zenzai.sh にあるので，それが変わったら取り直す
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/../models
          key: zenzai-${{ hashFiles('tools/models/fetch_zenzai.sh') }}
      # キャッシュから戻したときも SHA-256 を確かめる
      - run: make fetch-models
      - run: make test-debug
      - run: make test-zenzai
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            core/.build
            ~/Library/Caches/org.swift.swiftpm
          key: core-${{ runner.os }}-${{ hashFiles('core/Package.resolved') }}-${{ github.run_id }}

  app-macos:
    # 持ち主の PR は結果を待たずにマージするので動かさない(費用を抑える)．まとめて確かめるときは手で動かす．ほかの人の PR では動かす
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login != github.repository_owner
    # macOS のアプリをビルドできるか(署名はアドホック．project.yml の CODE_SIGN_IDENTITY)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
      # xcodegen の版は mise.toml で固定している
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: xcodegen
      - id: appbuild
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/macos/build/SourcePackages
          key: app-${{ runner.os }}-${{ hashFiles('core/Package.resolved') }}-${{ github.run_id }}
          restore-keys: |
            app-${{ runner.os }}-${{ hashFiles('core/Package.resolved') }}-
      - run: make build-macos
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/macos/build/SourcePackages
          key: app-${{ runner.os }}-${{ hashFiles('core/Package.resolved') }}-${{ github.run_id }}
