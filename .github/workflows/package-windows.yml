name: Package Windows

# Windows のインストーラー(.msi)を作る．release.yml から呼ぶほか，手で動かして作ったものを試せる:
#   gh workflow run package-windows.yml --ref <ブランチ>
#
# 署名は sign で選ぶ．署名するのは，インストーラーと，中の署名の無い EXE・DLL のすべて(tools/windows/sign.ps1)
#   none    署名しない
#   test    使い捨ての自己署名の証明書で，署名の手順を通しで確かめる(作ったものは配布しない)
#   certum  Certum のクラウドの証明書で署名する．次の値が要る
#     secrets.CERTUM_EMAIL     SimplySign のアカウントのメールアドレス
#     secrets.CERTUM_OTPAUTH   SimplySign のアプリを登録するときの QR コードの中身(otpauth://totp/... の全体)
#     vars.CERTUM_THUMBPRINT   使う証明書の拇印(省ける．証明書を更新したら入れ直す)
on:
  workflow_call:
    inputs:
      ref:
        description: 作るコミット(タグなど)．空なら呼び出したワークフローのコミット
        type: string
        default: ""
      sign:
        description: 署名(none・test・certum)
        type: string
        default: none
    secrets:
      CERTUM_EMAIL:
        required: false
      CERTUM_OTPAUTH:
        required: false
  workflow_dispatch:
    inputs:
      sign:
        description: 署名(none・test・certum)
        type: choice
        options:
          - none
          - test
          - certum
        default: none

permissions:
  contents: read

jobs:
  package-windows:
    # Visual Studio 2022 の入った環境に固定する．windows-2025 と windows-latest は Visual Studio 2026 の環境で，
    # その MSVC の STL(14.52)は Clang 22 以上を求めるので，Swift 6.3.3 の clang(21)では llama.cpp と core をビルドできない(STL1000)
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE
      # キャッシュは失敗・取り消しでも残す(restore と save を分ける)．鍵は実行ごとに変え，前の実行のものから戻す
      - id: swiftrelease
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: core/.build
          key: swift-release-zenzai-${{ runner.os }}-6.3.3-${{ hashFiles('core/Package.resolved') }}-${{ github.run_id }}
          restore-keys: |
            swift-release-zenzai-${{ runner.os }}-6.3.3-${{ hashFiles('core/Package.resolved') }}-
      # 配布物の llama.cpp はキャッシュを使わず，毎回ソースからビルドする(手元の PC で約 3 分．止まったときのために上限を付ける)
      - run: |
          tools/windows/build_llama.ps1 -Output "$env:RUNNER_TEMP\llama"
          "LLAMA_DIR=$env:RUNNER_TEMP\llama" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$env:RUNNER_TEMP\llama" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
        shell: pwsh
        timeout-minutes: 40
      - run: tools/windows/fetch_zenzai.ps1 -Output "$env:RUNNER_TEMP\zenzai"
        shell: pwsh
      - run: tools/dictionary/fetch_dictionary.ps1 -Output "$env:RUNNER_TEMP\dictionary"
        shell: pwsh
      - run: swift build --package-path core -c release --only-use-versions-from-resolved-file --product hajime-engine-host -Xswiftc "-L$env:LLAMA_DIR"
      - run: rustup toolchain install
        working-directory: apps/windows
      - run: rustup target add i686-pc-windows-msvc
        working-directory: apps/windows
      - run: cargo build --locked --release
        working-directory: apps/windows
      - run: cargo build --locked --release -p tsf --target i686-pc-windows-msvc
        working-directory: apps/windows
      - run: tools/windows/stage.ps1 -Output apps/windows/target/stage -Llama "$env:RUNNER_TEMP\llama" -Zenzai "$env:RUNNER_TEMP\zenzai" -Dictionary "$env:RUNNER_TEMP\dictionary\hajime-dictionary-0.5.3"
        shell: pwsh
      # 集めた DLL だけでエンジンが起動できることを確かめる(足りないと 0xC0000135 で終わり，入力できない)
      - run: tools/windows/check_stage.ps1 -Stage apps/windows/target/stage
        shell: pwsh
      - run: dotnet tool install --global wix --version 6.0.2
      # ここから署名．ビルドと道具の用意を終えてから証明書を使えるようにする(資格情報のある時間を短くする)
      - if: inputs.sign == 'certum'
        name: Certum の証明書を使えるようにする
        shell: pwsh
        env:
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTPAUTH: ${{ secrets.CERTUM_OTPAUTH }}
          CERTUM_THUMBPRINT: ${{ vars.CERTUM_THUMBPRINT }}
        run: tools/windows/sign_connect.ps1 -Provider certum
      - if: inputs.sign == 'test'
        name: 使い捨ての証明書を作る
        shell: pwsh
        run: tools/windows/sign_connect.ps1 -Provider test
      # インストーラーに入れる前に，中の EXE と DLL に署名する
      - if: inputs.sign != 'none'
        name: EXE と DLL に署名する
        shell: pwsh
        run: tools/windows/sign.ps1 -Path apps/windows/target/stage
      - name: インストーラーを作る(バージョンは apps/windows/Cargo.toml の workspace.package.version)
        shell: pwsh
        run: |
          $version = (cargo metadata --format-version 1 --no-deps --manifest-path apps/windows/Cargo.toml | ConvertFrom-Json).packages[0].version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "バージョンが読めません: $version" }
          New-Item -ItemType Directory -Force apps/windows/target/dist | Out-Null
          # 相対の場所は .wxs のフォルダから探されるので，集めたフォルダは絶対の場所で渡す．
          # ファイルを拾えないなどの警告はエラーにする(-wx)．中身の無いインストーラーを作らない
          $stage = (Resolve-Path apps/windows/target/stage).Path
          wix build apps/windows/installer/hajime.wxs -arch x64 -wx -d Version=$version -d "StageDir=$stage" -o "apps/windows/target/dist/Hajime-IME-$version.msi"
          if ($LASTEXITCODE -ne 0) { throw "インストーラーを作れませんでした" }
      - if: inputs.sign != 'none'
        name: インストーラーに署名する
        shell: pwsh
        run: tools/windows/sign.ps1 -Path apps/windows/target/dist -Include msi
      - if: always() && inputs.sign != 'none'
        name: 証明書を使えない状態に戻す
        shell: pwsh
        env:
          SIGN_PROVIDER: ${{ inputs.sign }}
        run: tools/windows/sign_disconnect.ps1 -Provider $env:SIGN_PROVIDER
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-windows
          path: apps/windows/target/dist/*.msi
          if-no-files-found: error
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: core/.build
          key: swift-release-zenzai-${{ runner.os }}-6.3.3-${{ hashFiles('core/Package.resolved') }}-${{ github.run_id }}
