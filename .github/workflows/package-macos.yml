name: Package macOS

# macOS の配布物(.pkg)を作る．release.yml から呼ぶほか，手で動かして作ったものを試せる:
#   gh workflow run package-macos.yml --ref <ブランチ>
# 署名と公証はしない(アドホック署名．利用者が署名の設定をするまで．docs/dev/RELEASE.md)
on:
  workflow_call:
    inputs:
      ref:
        description: 作るコミット(タグなど)．空なら呼び出したワークフローのコミット
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "使う Xcode: $xcode"
          sudo xcode-select -s "$xcode"
      # xcodegen の版は mise.toml で固定している
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: xcodegen
      # Zenzai のモデルは .pkg に入れる．取得元とハッシュは fetch_zenzai.sh にあり，package.sh が取って確かめる
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/../models
          key: zenzai-${{ hashFiles('tools/models/fetch_zenzai.sh') }}
      - run: make package-macos
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-macos
          path: apps/macos/build/dist/*.pkg
          if-no-files-found: error
