[workspace]
resolver = "2"
members = ["crates/ipc", "crates/tsf", "crates/tokens", "crates/candidate-ui", "crates/settings"]

[workspace.package]
# Windows 版のバージョン(docs/dev/adr/0008-versioning.md)．ここだけに書き，インストーラーと設定の画面はこの値を使う．
# 上げるのは tools/release/bump_version.sh windows
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.90"

[workspace.metadata.s90]
# ビルド番号．バージョンごとに 1 ずつ上げる整数(同じバージョンを作り直したときも上げる)
build = 2

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
windows = "=0.62.2"
windows-core = "=0.62.2"
windows-collections = "=0.3.2"
windows-future = "=0.3.2"
windows-numerics = "=0.3.1"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
panic = "unwind"
