[workspace]
resolver = "2"
members = ["crates/ipc", "crates/tsf", "crates/tokens", "crates/candidate-ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
windows = "=0.62.2"
windows-core = "=0.62.2"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
panic = "unwind"
