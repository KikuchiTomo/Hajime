[package]
name = "s90-fcitx5-bridge"
description = "Fcitx 5 のアドオン(C++)と s90-engine-host をつなぐ橋渡し．通信は Windows と同じ ipc を使う"
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.90"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
ipc = { path = "../../../windows/crates/ipc" }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
panic = "abort"
