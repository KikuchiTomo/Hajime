# Xcode のプロジェクトはこのファイルから作る(xcodegen generate)．.xcodeproj はコミットしない
name: Hajime
# Dev は開発版を入れるための構成．最適化はリリースと同じにする．
# Debug の構成ではエンジンと Zenzai(llama.cpp)が最適化なしでビルドされ，1 キーに数秒かかって入力できなくなるため
configs:
  Debug: debug
  Release: release
  Dev: release
options:
  bundleIdPrefix: men.haji
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    # IME の本体と補助のアプリ(更新・入力ソースの登録)で同じバージョンにする(tools/release/bump_version.sh が書き換える)
    MARKETING_VERSION: "0.2.7"
    CURRENT_PROJECT_VERSION: "25"
packages:
  HajimeCore:
    path: ../../core
targets:
  Hajime:
    type: application
    platform: macOS
    sources:
      - path: Hajime
        excludes:
          - "Info.plist"
          - "Hajime.entitlements"
      # 同梱したソフトウェアとモデルの著作権表示とライセンスの全文(THIRD_PARTY_NOTICES.md の求めによる)
      - path: ../../THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: ../../LICENSE
        buildPhase: resources
      - path: ../../LICENSES
        type: folder
        buildPhase: resources
      # 郵便番号の表(R-13)．data/postal は tools/postal/update.sh で作る
      - path: ../../data/postal/postal-codes.tsv
        buildPhase: resources
      # 連想変換の辞書(R-18)．data/thesaurus は tools/thesaurus/update.sh で日本語 WordNet から作る
      - path: ../../data/thesaurus/wordnet-ja.tsv
        buildPhase: resources
      # 同音異義語の使い分けの辞書(R-08)．data/usage は tools/usage/update.sh で japanese-usage-dictionary から取る
      - path: ../../data/usage/usage_dict.txt
        buildPhase: resources
      # Mozc の辞書から抜き出した同音異義語に，Claude で説明と用例を付けた辞書．tools/usage/gen で作る
      - path: ../../data/usage/usage_dict_extra.tsv
        buildPhase: resources
      # Mozc の辞書から抜き出した，同音異義語の無いよく使う語に，Claude で意味と用例を付けた辞書．tools/usage/gen で作る
      - path: ../../data/usage/usage_dict_words.tsv
        buildPhase: resources
      # 英語の語の辞書(R-24)．このリポジトリで書いた一覧
      - path: ../../data/english/english-terms.txt
        buildPhase: resources
      # 絵文字と記号のパレットの表(R-26)．palette.tsv は tools/palette/update.sh で作る
      - path: ../../data/palette/palette.tsv
        buildPhase: resources
      # 変換の候補に足す絵文字の，同じ意味の語の一覧(R-26)．手で書く．パレットの表と同じ場所から読む
      - path: ../../data/palette/emoji-synonyms.tsv
        buildPhase: resources
    postBuildScripts:
      - name: 入力ソースの表示名を書く
        path: ../../tools/macos/write_input_source_names.sh
        inputFiles:
          - $(SRCROOT)/../../tools/macos/write_input_source_names.sh
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ja.lproj/InfoPlist.strings
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/en.lproj/InfoPlist.strings
      - name: Zenzai のモデルを入れる
        path: ../../tools/macos/copy_zenzai_model.sh
        inputFiles:
          - $(SRCROOT)/../../tools/macos/copy_zenzai_model.sh
          - $(SRCROOT)/../../../models/zenz-v3.2-small-Q5_K_M.gguf
          - $(SRCROOT)/../../../models/zenz-v3.2-xsmall-Q5_K_M.gguf
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Zenzai/zenz-v3.2-small-Q5_K_M.gguf
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Zenzai/zenz-v3.2-xsmall-Q5_K_M.gguf
      - name: jinen のモデルを入れる
        path: ../../tools/macos/copy_jinen_model.sh
        inputFiles:
          - $(SRCROOT)/../../tools/macos/copy_jinen_model.sh
          - $(SRCROOT)/../../../models/jinen-v2-small-Q5_K_M.gguf
          - $(SRCROOT)/../../../models/jinen-v2-xsmall-Q5_K_M.gguf
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Jinen/jinen-v2-small-Q5_K_M.gguf
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Jinen/jinen-v2-xsmall-Q5_K_M.gguf
      - name: かな漢字変換の辞書を入れる
        path: ../../tools/macos/copy_dictionary.sh
        inputFiles:
          - $(SRCROOT)/../../tools/macos/copy_dictionary.sh
          - $(SRCROOT)/../../../models/hajime-dictionary-0.5.2/Dictionary/SHA256SUMS
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Dictionary/SHA256SUMS
    dependencies:
      # 更新用のアプリを Contents/Helpers に入れる(R-19)
      - target: HajimeUpdater
        embed: true
        codeSign: false
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      # 入力ソースの登録を直す補助のアプリも Contents/Helpers に入れる(HajimeInputSourceHelper/main.swift)
      - target: HajimeInputSourceHelper
        embed: true
        codeSign: false
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - package: HajimeCore
        product: HajimeDomain
      - package: HajimeCore
        product: HajimeApplication
      - package: HajimeCore
        product: HajimeEngine
      - package: HajimeCore
        product: HajimePersistence
    settings:
      base:
        PRODUCT_NAME: "Hajime"
        # InputMethodKit に並行性の注釈が無いため，このターゲットだけ Swift 5 の言語モードにする．
        # 判断を持つ core は Swift 6 の厳格な検査のまま(docs/dev/GUIDELINES.md)
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        # Zenzai(llama.cpp)を含むエンジンを読み込むため，C++ との相互運用を有効にする(azooKey-Desktop と同じ設定)
        SWIFT_OBJC_INTEROP_MODE: objcxx
        PRODUCT_MODULE_NAME: Hajime
        # 入力メソッドのバンドル ID は .inputmethod. を途中に含める．men.haji.inputmethod のように inputmethod で終わる ID は，
        # OS が入力ソースとして登録しない(2026-10-30 に確かめた)
        PRODUCT_BUNDLE_IDENTIFIER: men.haji.inputmethod.Hajime
        INFOPLIST_FILE: Hajime/Info.plist
        CODE_SIGN_ENTITLEMENTS: Hajime/Hajime.entitlements
        # 署名は tools/macos/install.sh が Apple Development の証明書で行う．
        # 証明書の無い環境でもビルドだけはできるよう，既定はアドホック署名にしておく
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        # 本番と開発版で変わる値．Info.plist から読む
        HAJIME_SUPPORT_DIRECTORY: men.haji.inputmethod
        HAJIME_ICON_SUFFIX: ""
        # 入力メニューに出す名前．make install-macos NAME=… で変えられる(tools/macos/write_input_source_names.sh)
        HAJIME_DISPLAY_NAME: "Hajime IME"
        # 英字の入力モードの名前は，入力メニューに出す名前のあとにこれを付ける(日本語の環境と英語の環境)
        HAJIME_ROMAN_MODE_SUFFIX: "英字"
        HAJIME_ROMAN_MODE_SUFFIX_EN: "English"
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
      # Dev と Debug は開発版．本番と別のアプリ・別の入力ソース・別の学習データになり，並べて入れて試せる．
      # 入れるのは Dev(最適化あり)．Debug は Xcode で動きを追うときと，見た目の画像を書き出すときに使う
      # Dev と Debug はバンドル ID を分ける．macOS はアプリのデータの置き場所(コンテナ)を最初に作ったアプリの署名に結び付け，
      # 署名が違うアプリが同じ置き場所を使おうとすると，起動の途中で止める．Debug(画像の書き出しに使う．アドホック署名)と
      # 入れる開発版(証明書で署名)が同じ ID だと，入れた開発版が止まって入力できなくなる．開発版の ID は前に使っていた .dev から変えた
      configs:
        Dev:
          PRODUCT_NAME: "Hajime Dev"
          PRODUCT_BUNDLE_IDENTIFIER: men.haji.inputmethod.develop
          HAJIME_SUPPORT_DIRECTORY: men.haji.inputmethod.develop
          HAJIME_ICON_SUFFIX: "-dev"
          HAJIME_DISPLAY_NAME: "Hajime IME Dev"
        Debug:
          PRODUCT_NAME: "Hajime Debug"
          PRODUCT_BUNDLE_IDENTIFIER: men.haji.inputmethod.debug
          HAJIME_SUPPORT_DIRECTORY: men.haji.inputmethod.debug
          HAJIME_ICON_SUFFIX: "-dev"
          HAJIME_DISPLAY_NAME: "Hajime IME Debug"
# スキームを書いておく．書かないと xcodebuild が自動で作るスキームで実行先の機種が決まらず，
# 「Supported platforms for the buildables in the current scheme is empty」と出る
  # 更新用のアプリ(R-19)．IME の本体はサンドボックスの中で通信できないので，更新の確認・ダウンロード・インストールはこのアプリが行う．
  # キー入力は受け取らない．管理者の権限で OS のインストーラーを動かすため，サンドボックスには入れない(ハードンドランタイムは付ける)
  HajimeUpdater:
    type: application
    platform: macOS
    sources:
      - path: HajimeUpdater
        excludes:
          - "Info.plist"
      # 更新の窓に Hajime IME のアイコンを出す(tools/icons/make_app_icon.sh)
      - path: Hajime/Resources/Hajime.icns
        buildPhase: resources
    dependencies:
      - package: HajimeCore
        product: HajimeDomain
    settings:
      base:
        PRODUCT_NAME: "Hajime IME Updater"
        PRODUCT_MODULE_NAME: HajimeUpdater
        PRODUCT_BUNDLE_IDENTIFIER: men.haji.inputmethod.Hajime.Updater
        INFOPLIST_FILE: HajimeUpdater/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        SKIP_INSTALL: YES
      configs:
        Dev:
          PRODUCT_BUNDLE_IDENTIFIER: men.haji.inputmethod.develop.Updater
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: men.haji.inputmethod.debug.Updater
  # 入力ソースの登録を直す補助のアプリ．OS が入れた IME を入力ソースの一覧から外したとき，IME の本体はサンドボックスの中から
  # 登録し直せないので，このアプリが登録し直す．キー入力は受け取らず，通信もしない．入力ソースの一覧はサンドボックスの外で
  # 共有されているので，サンドボックスには入れない(ハードンドランタイムは付ける)
  HajimeInputSourceHelper:
    type: application
    platform: macOS
    sources:
      - path: HajimeInputSourceHelper
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_NAME: "Hajime IME Input Source Helper"
        PRODUCT_MODULE_NAME: HajimeInputSourceHelper
        PRODUCT_BUNDLE_IDENTIFIER: men.haji.inputmethod.Hajime.InputSourceHelper
        INFOPLIST_FILE: HajimeInputSourceHelper/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        SKIP_INSTALL: YES
      configs:
        Dev:
          PRODUCT_BUNDLE_IDENTIFIER: men.haji.inputmethod.develop.InputSourceHelper
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: men.haji.inputmethod.debug.InputSourceHelper
schemes:
  Hajime:
    build:
      targets:
        Hajime: all
    run:
      config: Debug
    archive:
      config: Release
