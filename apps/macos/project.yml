# Xcode のプロジェクトはこのファイルから作る(xcodegen generate)．.xcodeproj はコミットしない
name: Hajime
# Dev は開発版を入れるための構成．最適化はリリースと同じにする．
# Debug の構成ではエンジンと Zenzai(llama.cpp)が最適化なしでビルドされ，1 キーに数秒かかって入力できなくなるため
configs:
  Debug: debug
  Release: release
  Dev: release
options:
  bundleIdPrefix: men.haji
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
packages:
  HajimeCore:
    path: ../../core
targets:
  Hajime:
    type: application
    platform: macOS
    sources:
      - path: Hajime
        excludes:
          - "Info.plist"
          - "Hajime.entitlements"
      # 同梱したソフトウェアとモデルの著作権表示とライセンスの全文(THIRD_PARTY_NOTICES.md の求めによる)
      - path: ../../THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: ../../LICENSE
        buildPhase: resources
      - path: ../../LICENSES
        type: folder
        buildPhase: resources
      # 郵便番号の表(R-13)．data/postal は tools/postal/update.sh で作る
      - path: ../../data/postal/postal-codes.tsv
        buildPhase: resources
      # 連想変換の辞書(R-18)．data/thesaurus は tools/thesaurus/update.sh で日本語 WordNet から作る
      - path: ../../data/thesaurus/wordnet-ja.tsv
        buildPhase: resources
    postBuildScripts:
      - name: 入力ソースの表示名を書く
        path: ../../tools/macos/write_input_source_names.sh
        inputFiles:
          - $(SRCROOT)/../../tools/macos/write_input_source_names.sh
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ja.lproj/InfoPlist.strings
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/en.lproj/InfoPlist.strings
      - name: Zenzai のモデルを入れる
        path: ../../tools/macos/copy_zenzai_model.sh
        inputFiles:
          - $(SRCROOT)/../../tools/macos/copy_zenzai_model.sh
          - $(SRCROOT)/../../../models/zenz-v3.2-small-Q5_K_M.gguf
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Zenzai/zenz-v3.2-small-Q5_K_M.gguf
    dependencies:
      - package: HajimeCore
        product: HajimeDomain
      - package: HajimeCore
        product: HajimeApplication
      - package: HajimeCore
        product: HajimeEngine
      - package: HajimeCore
        product: HajimePersistence
    settings:
      base:
        PRODUCT_NAME: "Hajime"
        # InputMethodKit に並行性の注釈が無いため，このターゲットだけ Swift 5 の言語モードにする．
        # 判断を持つ core は Swift 6 の厳格な検査のまま(docs/dev/GUIDELINES.md)
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        # Zenzai(llama.cpp)を含むエンジンを読み込むため，C++ との相互運用を有効にする(azooKey-Desktop と同じ設定)
        SWIFT_OBJC_INTEROP_MODE: objcxx
        PRODUCT_MODULE_NAME: Hajime
        # 入力メソッドのバンドル ID は .inputmethod. を途中に含める．men.haji.inputmethod のように inputmethod で終わる ID は，
        # OS が入力ソースとして登録しない(2026-10-30 に確かめた)
        PRODUCT_BUNDLE_IDENTIFIER: men.haji.inputmethod.Hajime
        INFOPLIST_FILE: Hajime/Info.plist
        CODE_SIGN_ENTITLEMENTS: Hajime/Hajime.entitlements
        # 署名は tools/macos/install.sh が Apple Development の証明書で行う．
        # 証明書の無い環境でもビルドだけはできるよう，既定はアドホック署名にしておく
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        # 本番と開発版で変わる値．Info.plist から読む
        HAJIME_SUPPORT_DIRECTORY: men.haji.inputmethod
        HAJIME_ICON_SUFFIX: ""
        # 入力メニューに出す名前．make install-macos NAME=… で変えられる(tools/macos/write_input_source_names.sh)
        HAJIME_DISPLAY_NAME: "はじめ"
        # 英字の入力モードの名前
        HAJIME_DISPLAY_NAME_EN: "Hajime"
        MARKETING_VERSION: "0.1.9"
        CURRENT_PROJECT_VERSION: "11"
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
      # Dev と Debug は開発版．本番と別のアプリ・別の入力ソース・別の学習データになり，並べて入れて試せる．
      # 入れるのは Dev(最適化あり)．Debug は Xcode で動きを追うときと，見た目の画像を書き出すときに使う
      # Dev と Debug はバンドル ID を分ける．macOS はアプリのデータの置き場所(コンテナ)を最初に作ったアプリの署名に結び付け，
      # 署名が違うアプリが同じ置き場所を使おうとすると，起動の途中で止める．Debug(画像の書き出しに使う．アドホック署名)と
      # 入れる開発版(証明書で署名)が同じ ID だと，入れた開発版が止まって入力できなくなる．開発版の ID は前に使っていた .dev から変えた
      configs:
        Dev:
          PRODUCT_NAME: "Hajime Dev"
          PRODUCT_BUNDLE_IDENTIFIER: men.haji.inputmethod.develop
          HAJIME_SUPPORT_DIRECTORY: men.haji.inputmethod.develop
          HAJIME_ICON_SUFFIX: "-dev"
          HAJIME_DISPLAY_NAME: "はじめ Dev"
          HAJIME_DISPLAY_NAME_EN: "Hajime Dev"
        Debug:
          PRODUCT_NAME: "Hajime Debug"
          PRODUCT_BUNDLE_IDENTIFIER: men.haji.inputmethod.debug
          HAJIME_SUPPORT_DIRECTORY: men.haji.inputmethod.debug
          HAJIME_ICON_SUFFIX: "-dev"
          HAJIME_DISPLAY_NAME: "はじめ Debug"
          HAJIME_DISPLAY_NAME_EN: "Hajime Debug"
# スキームを書いておく．書かないと xcodebuild が自動で作るスキームで実行先の機種が決まらず，
# 「Supported platforms for the buildables in the current scheme is empty」と出る
schemes:
  Hajime:
    build:
      targets:
        Hajime: all
    run:
      config: Debug
    archive:
      config: Release
